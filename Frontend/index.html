<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeVoice | Complaint Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav id="navbar" class="hidden">
    <a href="#" class="logo" id="nav-logo">SafeVoice</a>
    <div class="nav-links">
      <span id="user-display" style="font-size: 0.8rem; color: var(--text-muted);"></span>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </nav>

  <main id="app">
    <!-- Content will be injected here by app.js -->
    <div class="container">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
        <div class="spinner"></div>
        <p>Loading SafeVoice...</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
